name: Render Existing Hyperframes Project

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: 'Path to the Hyperframes project directory'
        required: true
        default: 'output/history-of-computing-documentary-project'
      quality:
        description: 'Render quality: draft, standard, high'
        required: true
        default: 'draft'
      resolution:
        description: 'Output resolution preset (landscape, portrait, square, 1080p, 4k)'
        required: true
        default: 'landscape'
      fps:
        description: 'Frame rate: 15, 24, 30, 60'
        required: true
        default: '15'
      workers:
        description: 'Render workers (use 1 on standard GitHub runners to avoid CPU thrashing)'
        required: true
        default: '1'
      low_memory_mode:
        description: 'Force low memory mode to stabilize rendering (true/false)'
        required: true
        default: 'true'

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Hyperframes Render
        run: |
          PROJECT_DIR="${{ github.event.inputs.project_dir }}"
          QUALITY="${{ github.event.inputs.quality }}"
          RESOLUTION="${{ github.event.inputs.resolution }}"
          FPS="${{ github.event.inputs.fps }}"
          WORKERS="${{ github.event.inputs.workers }}"
          LOW_MEM="${{ github.event.inputs.low_memory_mode }}"
          
          echo "Rendering project: $PROJECT_DIR"
          echo "Settings: Quality=$QUALITY, Resolution=$RESOLUTION, FPS=$FPS, Workers=$WORKERS, LowMemory=$LOW_MEM"
          
          cd "$PROJECT_DIR"
          
          # Construct CLI arguments
          ARGS="--output ../rendered-video.mp4 --quality $QUALITY --resolution $RESOLUTION --fps $FPS --workers $WORKERS"
          
          if [ "$LOW_MEM" = "true" ]; then
            ARGS="$ARGS --low-memory-mode"
          else
            ARGS="$ARGS --no-low-memory-mode"
          fi
          
          npx hyperframes render $ARGS

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: output/rendered-video.mp4
          if-no-files-found: error
